name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: takos-computer-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned: v6.0.2 (2026)
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinned: v2.0.2
        with:
          bun-version: 1.3.14
      - uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # pinned: v2
        with:
          tofu_version: 1.12.1
          tofu_wrapper: false
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:all
      - run: bun run build:all
      - run: bun run check:dist
      - run: bun run check:opentofu
      - name: Build the sandbox Container image
        run: docker build --file apps/sandbox/Dockerfile --tag takos-computer-sandbox:ci .
      - name: Cache locked OpenTofu provider packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # pinned: v5.0.5 (2026)
        with:
          path: ${{ runner.temp }}/takos-computer-provider-mirror
          key: takos-computer-providers-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.terraform.lock.hcl') }}
      - name: Prepare the locked provider mirror
        shell: bash
        run: |
          set -euo pipefail
          mirror="$RUNNER_TEMP/takos-computer-provider-mirror/registry.opentofu.org"
          download_provider() {
            local namespace="$1" name="$2" version="$3" repository="$4"
            local directory="$mirror/$namespace/$name"
            local archive="terraform-provider-${name}_${version}_linux_amd64.zip"
            mkdir -p "$directory"
            if [[ ! -f "$directory/$archive" ]]; then
              curl --fail --location \
                "https://github.com/$repository/releases/download/v$version/$archive" \
                --output "$directory/$archive.partial"
              mv "$directory/$archive.partial" "$directory/$archive"
            fi
          }
          download_provider cloudflare cloudflare 5.19.1 cloudflare/terraform-provider-cloudflare
          download_provider hashicorp random 3.9.0 opentofu/terraform-provider-random
      - name: Validate and plan the OpenTofu Capsule
        shell: bash
        run: |
          set -euo pipefail
          # The native installer verifies even cache hits against the committed
          # lockfile. A corrupt/unlisted package must fail before validation.
          tofu init -backend=false -input=false -lockfile=readonly \
            -plugin-dir="$RUNNER_TEMP/takos-computer-provider-mirror"
          tofu validate
          tofu plan -input=false -refresh=false -lock=false \
            -var enable_cloudflare_resources=true \
            -var cloudflare_account_id=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            -var cloudflare_workers_subdomain=example \
            -var published_mcp_auth_token=12345678901234567890123456789012 \
            -out=/tmp/takos-computer.tfplan
          tofu plan -input=false -refresh=false -lock=false \
            -var enable_cloudflare_resources=true \
            -var cloudflare_account_id=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            -var cloudflare_workers_subdomain=example \
            -var takosumi_accounts_issuer_url=https://accounts.example.test \
            -var app_capsule_id=cap_ci \
            -out=/tmp/takos-computer-capsule-only.tfplan
          if tofu plan -input=false -refresh=false -lock=false \
            -var enable_cloudflare_resources=true \
            -var cloudflare_account_id=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            -var cloudflare_workers_subdomain=example \
            -var published_mcp_auth_token=12345678901234567890123456789012 \
            -var takosumi_accounts_issuer_url=https://accounts.example.test \
            -var enable_app_oidc=true \
            -var oidc_client_id=client_ci \
            > /tmp/takos-computer-unbound-oidc.log 2>&1; then
            echo "Expected unbound OIDC plan to require a sandbox creation choice"
            exit 1
          fi
          cat /tmp/takos-computer-unbound-oidc.log
          grep -F 'allow_public_sandbox_creation' /tmp/takos-computer-unbound-oidc.log
          tofu plan -input=false -refresh=false -lock=false \
            -var enable_cloudflare_resources=true \
            -var cloudflare_account_id=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            -var cloudflare_workers_subdomain=example \
            -var published_mcp_auth_token=12345678901234567890123456789012 \
            -var takosumi_accounts_issuer_url=https://accounts.example.test \
            -var enable_app_oidc=true \
            -var oidc_client_id=client_ci \
            -var allow_public_sandbox_creation=false \
            -out=/tmp/takos-computer-unbound-oidc-explicit-deny.tfplan
