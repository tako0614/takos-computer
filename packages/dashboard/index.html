<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Takos Computer</title>
    <meta
      name="description"
      content="Dashboard for the Takos Computer containerized sandbox environment for AI agents."
    >
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0f172a">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <!-- Home-screen install. The Worker serves these before the /gui/* auth gate. -->
    <link rel="manifest" href="/gui/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/gui/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/gui/icons/apple-touch-icon.png">
    <script>
      /* Pre-hydration language & theme init: mirrors i18n.ts and lib/theme.ts
         so <html lang> and data-theme are correct before the bundle runs. */
      (function () {
        try {
          var lang = localStorage.getItem("takos-lang");
          if (lang !== "ja" && lang !== "en") {
            lang = (navigator.language || "").toLowerCase().startsWith("ja")
              ? "ja"
              : "en";
          }
          document.documentElement.lang = lang;
          var theme = localStorage.getItem("takos-theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
          }
        } catch {
          /* localStorage may be unavailable; the app will apply defaults. */
        }
      })();
    </script>
    <style>
      /* Pre-hydration flash guard — must match styles.css body background /
         color so there is no color jump when the stylesheet loads. */
      html,
      body {
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme="dark"]),
        html:not([data-theme="dark"]) body {
          background: #f8fafc;
          color: #0f172a;
        }
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #f8fafc;
        color: #0f172a;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #0f172a;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
